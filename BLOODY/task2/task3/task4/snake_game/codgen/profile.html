<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Public Profile | Wanderlog</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Wanderlog ✈️
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#trips">
                    My Trips
                </a>

            </div>

        </nav>

    </header>


    <!-- PROFILE -->

    <main class="profile-page">


        <!-- PROFILE HEADER -->

        <section class="profile-header">

            <div class="profile-avatar">
                🌍
            </div>


            <h1 id="profileName">
                Loading...
            </h1>


            <p id="profileBio">
                Loading profile...
            </p>


            <p id="profileTripCount">
                Loading trips...
            </p>

        </section>


        <!-- PROFILE TITLE -->

        <section class="profile-title">

            <h2>
                Travel Journal 🗺️
            </h2>

            <p>
                Explore this traveler's memories.
            </p>

        </section>


        <!-- LOADING -->

        <div
            id="profileLoading"
            class="state-message"
        >
            Loading profile...
        </div>


        <!-- TRIPS -->

        <div
            id="profileTrips"
            class="trip-container"
        ></div>


        <!-- EMPTY -->

        <div
            id="profileEmpty"
            class="state-message"
        >

            <div class="empty-icon">
                ✈️
            </div>

            <h3>
                No trips yet
            </h3>

            <p>
                This traveler has not added any trips yet.
            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Wanderlog | Public Profile
        </p>

    </footer>


    <script src="profile.js"></script>

</body>

</html>
